<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Is Whitman Rowing Today?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b1e2d;      /* deep river navy - background */
    --ink-2: #142b3d;    /* card panel */
    --mist: #93a9b8;     /* muted secondary text */
    --fog: #eef2f4;      /* primary text on dark */
    --dawn: #74b0da;     /* Whitman blue accent (Pantone 542C) */
    --go: #00FF00;       /* practice on */
    --stop: #FF0000;     /* practice off */
    --partial: #FFA500;  /* partial practice */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    color: var(--fog);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 40px;
  }

  header {
    text-align: center;
    max-width: 480px;
  }

  .eyebrow {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dawn);
    margin: 0 0 6px;
  }

  h1 {
    font-size: 22px;
    font-weight: 500;
    margin: 0;
    color: var(--fog);
  }

  .horizon {
    width: 100%;
    max-width: 480px;
    height: 2px;
    margin: 22px 0 28px;
    background: linear-gradient(90deg, transparent, var(--dawn), transparent);
    background-size: 200% 100%;
    animation: drift 6s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .horizon { animation: none; }
  }

  @keyframes drift {
    0%, 100% { background-position: 0% 0%; }
    50% { background-position: 100% 0%; }
  }

  main {
    width: 100%;
    max-width: 480px;
  }

  .status-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }


  .card {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 200px;
    background: var(--ink-2);
    border-radius: 12px;
    border-top: 3px solid var(--mist);
    padding: 24px 20px 28px;
    text-align: center;
  }

  .card.is-yes { border-top-color: var(--go); }
  .card.is-no  { border-top-color: var(--stop); }
  .card.is-partial { border-top-color: var(--partial); }

  .regatta-card {
    margin-top: 16px;
    background: var(--ink-2);
    border-radius: 12px;
    border-top: 3px solid var(--dawn);
    padding: 24px 20px 28px;
    text-align: center;
  }

  .regatta-status {
    display: block;
    font-family: 'Bebas Neue', 'Inter', sans-serif;
    font-size: 32px;
    line-height: 1.2;
    letter-spacing: 0.02em;
    color: var(--dawn);
  }

  .label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mist);
  }

  .date {
    display: block;
    font-size: 13px;
    color: var(--mist);
    margin-top: 2px;
  }

  .status {
    display: block;
    font-family: 'Bebas Neue', 'Inter', sans-serif;
    font-size: 52px;
    line-height: 1.1;
    letter-spacing: 0.03em;
    margin-top: 10px;
    color: var(--mist);
    white-space: nowrap;
  }

  .card.is-yes .status { color: var(--go); }
  .card.is-no .status  { color: var(--stop); }
  .card.is-partial .status { color: var(--partial); }

  .reason {
    display: inline-block;
    margin-top: 14px;
    padding: 4px 12px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.06);
    font-size: 12px;
    color: var(--mist);
    letter-spacing: 0.02em;
    white-space: pre-line;   /* keeps line breaks typed into the sheet / form */
    line-height: 1.5;
  }

  .note {
    text-align: center;
    font-size: 13px;
    color: var(--mist);
    margin-top: 24px;
    line-height: 1.6;
  }

  .note.error { color: var(--stop); }

  /* Desktop sizes. Kept after the base rules above so they take effect. */
  @media (min-width: 560px) {
    header { max-width: 960px; }
    .horizon { max-width: 960px; }
    main { max-width: 960px; }
    .status-grid { flex-direction: row; gap: 32px; }
    .card { min-height: 400px; padding: 48px 40px 56px; }
    .label { font-size: 26px; }
    .date { font-size: 26px; }
    .status { font-size: 84px; margin-top: 20px; }
    .reason { font-size: 24px; padding: 8px 20px; margin-top: 28px; }
    .regatta-card { margin-top: 32px; padding: 48px 40px 56px; }
    .regatta-status { font-size: 56px; }
  }

  /* ----- Rolling 5-day (winter) layout ----- */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-top: 12px;
  }

  .card.compact {
    min-height: 0;
    justify-content: flex-start;
    padding: 16px 10px 18px;
  }

  .card.compact .status { font-size: 36px; margin-top: 6px; }
  .card.compact .reason { font-size: 11px; padding: 4px 8px; margin-top: 10px; }

  /* Winter shift times: larger and brighter than other notes. */
  .reason.shifts { font-size: 16px; font-weight: 600; color: var(--fog); padding: 8px 12px; }
  .card.compact .reason.shifts { font-size: 14px; padding: 6px 10px; }

  /* One line with the winter shift times, shown above the cards. */
  .shift-key {
    text-align: center;
    font-size: 14px;
    color: var(--mist);
    margin: -8px 0 20px;
  }
  .shift-key strong { color: var(--fog); font-weight: 600; }

  @media (min-width: 560px) {
    .week-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; margin-top: 20px; }
    .card.compact { min-height: 0; padding: 24px 14px 28px; }
    .card.compact .label { font-size: 14px; }
    .card.compact .date { font-size: 14px; }
    /* Shrinks on narrow screens so a long word like PARTIAL still fits. */
    .card.compact .status { font-size: clamp(30px, 4.6vw, 44px); margin-top: 8px; }
    .card.compact .reason { font-size: 12px; padding: 6px 10px; margin-top: 12px; }
    .reason.shifts { font-size: 20px; }
    .card.compact .reason.shifts { font-size: clamp(12px, 1.7vw, 16px); }
    /* 5-day layout: the lone Today card doesn't need the tall two-day height. */
    .status-grid .card:only-child { min-height: 0; padding: 36px 40px 40px; }
    .shift-key { font-size: 18px; margin: -4px 0 28px; }
  }
</style>
</head>
<body>

  <header>
    <p class="eyebrow">Whitman Rowing</p>
    <h1>PRACTICE?</h1>
  </header>

  <div class="horizon" aria-hidden="true"></div>

  <main>
    <p class="shift-key" id="shift-key" hidden></p>
    <!-- Cards are built by the script below, based on LAYOUT. -->
    <div class="status-grid" id="status-grid"></div>
    <div class="week-grid" id="week-grid" hidden></div>

    <div class="regatta-card" id="regatta-card" hidden>
      <span class="regatta-status" id="regatta-status"></span>
      <span class="reason" id="regatta-reason"></span>
    </div>

    <p class="note" id="note">Loading today&rsquo;s schedule&hellip;</p>
  </main>

<script>
  // ----- CONFIG: fill these in from your Google Sheet -----
  // SHEET_ID comes from the sheet's URL: .../d/SHEET_ID/edit
  const SHEET_ID = '1c_h72UnGtO8P7U2iy6oPifMRiUG_rVsxAQlHhlyRCZ0';
  const SEASONS_GID = '0';
  const OVERRIDES_GID = '884628836';
  // ----------------------------------------------------------

  // ----- LAYOUT: switch by hand when the season changes -----
  //   'week'   = winter: today plus the next 4 days, with Saturday and
  //              Sunday combined into one "Weekend" card
  //   'twoDay' = on the water (spring/fall): just Today and Tomorrow
  const LAYOUT = 'week';
  // ----------------------------------------------------------

  const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  // ----- WINTER SHIFTS: edit the times here if they change -----
  // Winter practices run in two shifts, Girls and Boys on opposite ones.
  //   Mon / Wed ............ Girls early, Boys late
  //   Tue / Thu ............ Girls late,  Boys early
  //   Fri (even date) ...... Girls early, Boys late
  //   Fri (odd date) ....... Girls late,  Boys early
  const WINTER_SHIFTS = {
    early: '3:30PM-5:30PM',
    late:  '5:00PM-7:00PM'
  };

  // Shown on every Weekend card in the 5-day layout.
  const WEEKEND_TEXT = 'Athletes check slack for coach assigned OYO workout';
  // -------------------------------------------------------------

  // Returns the two-line "Early: ... / Late: ..." shift text for a winter practice
  // day, or null if the weekday has no shift pattern (Sat/Sun).
  function winterShiftText(date) {
    const day = date.getDay();
    let girlsEarly;
    if (day === 1 || day === 3) girlsEarly = true;
    else if (day === 2 || day === 4) girlsEarly = false;
    else if (day === 5) girlsEarly = date.getDate() % 2 === 0;
    else return null;

    const early = girlsEarly ? 'Girls' : 'Boys';
    const late  = girlsEarly ? 'Boys'  : 'Girls';
    return 'Early: ' + early + '\nLate: ' + late;
  }

  // Loads a sheet tab via a <script> tag instead of fetch(). Script tags
  // aren't subject to CORS the way fetch requests are, which sidesteps
  // the "Failed to fetch" error Google's export links were triggering.
  function loadTab(gid) {
    return new Promise((resolve, reject) => {
      const callbackName = 'gvizCallback_' + gid + '_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');

      const timeout = setTimeout(() => {
        cleanup();
        reject(new Error('Timed out loading sheet data (gid ' + gid + ')'));
      }, 8000);

      function cleanup() {
        clearTimeout(timeout);
        delete window[callbackName];
        script.remove();
      }

      window[callbackName] = function (data) {
        cleanup();
        resolve(data);
      };

      script.onerror = function () {
        cleanup();
        reject(new Error('Failed to load sheet data (gid ' + gid + ')'));
      };

      script.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
        '/gviz/tq?gid=' + gid + '&tqx=responseHandler:' + callbackName;
      document.body.appendChild(script);
    });
  }

  // Converts the gviz table response into the same shape our lookup
  // logic expects: an array of objects keyed by column header.
  function tableToObjects(data) {
    const cols = data.table.cols.map(c => c.label || c.id);
    return data.table.rows.map(r => {
      const obj = {};
      cols.forEach((label, i) => {
        const cell = r.c[i];
        if (!cell) { obj[label] = ''; return; }
        obj[label] = (cell.f != null) ? cell.f : (cell.v != null ? String(cell.v) : '');
      });
      return obj;
    });
  }

  async function fetchTab(gid) {
    const data = await loadTab(gid);
    return tableToObjects(data);
  }

  function parseDate(str) {
    if (!str) return null;
    const d = new Date(str);
    if (isNaN(d.getTime())) return null;
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function sameDay(a, b) {
    return a && b &&
      a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate();
  }

  function normalizeStatus(v) {
    const s = (v || '').trim().toUpperCase();
    if (s === 'YES') return 'YES';
    if (s === 'PARTIAL') return 'PARTIAL';
    if (s === 'REGATTA') return 'REGATTA';
    return 'NO';
  }

  // An override for the date wins, and its Reason (if given) is shown
  // as-is. Otherwise, use the season's weekly pattern, with the reason
  // shown as "Standard Schedule" (or the Early/Late squads on a
  // winter YES day). If neither applies, default to NO.
  function detailsFor(date, seasons, overrides) {
    const season = seasons.find(s => {
      const start = parseDate(s['Start Date']);
      const end = parseDate(s['End Date']);
      return start && end && date >= start && date <= end;
    });
    const isWinter = !!season &&
      (season['Season'] || '').trim().toLowerCase() === 'winter';

    // Default text for a YES day: shift times in winter, otherwise standard.
    const shiftText = isWinter ? winterShiftText(date) : null;
    function yesText() {
      return shiftText || 'Standard Schedule';
    }
    // Flags Early/Late text so the card can style it and show the shift key.
    function result(status, reason) {
      return { status, reason, shifts: !!shiftText && reason === shiftText };
    }

    // Newest form submission wins if a date was entered more than once
    // (form rows are appended in the order they're submitted).
    const override = [...overrides].reverse().find(o =>
      sameDay(parseDate(o['Date']), date) && normalizeStatus(o['Status']) !== 'REGATTA'
    );
    if (override) {
      const status = normalizeStatus(override['Status']);
      const reasonRaw = (override['Reason'] || '').trim();
      let reason;
      if (reasonRaw) reason = reasonRaw;
      else if (status === 'PARTIAL') reason = 'Check Slack for Details';
      else if (status === 'YES') reason = yesText();
      else reason = 'Standard Schedule';
      return { ...result(status, reason), fromForm: !!reasonRaw };
    }

    const status = season ? normalizeStatus(season[WEEKDAYS[date.getDay()]]) : 'NO';
    return result(status, status === 'YES' ? yesText() : 'Standard Schedule');
  }

  // Finds the soonest REGATTA-status row landing within the next 7 days
  // (today through 6 days out, inclusive). Returns null if none.
  function upcomingRegatta(today, overrides) {
    const horizon = new Date(today);
    horizon.setDate(horizon.getDate() + 6);

    return overrides
      .filter(o => normalizeStatus(o['Status']) === 'REGATTA')
      .map(o => ({ date: parseDate(o['Date']), reason: (o['Reason'] || '').trim() }))
      .filter(r => r.date && r.date >= today && r.date <= horizon)
      .sort((a, b) => a.date - b.date)[0] || null;
  }

  function renderRegatta(regatta) {
    const card = document.getElementById('regatta-card');
    if (!regatta) { card.hidden = true; return; }

    const dateText = regatta.date
      .toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })
      .toUpperCase();
    document.getElementById('regatta-status').textContent = 'REGATTA ON ' + dateText;

    const reasonEl = document.getElementById('regatta-reason');
    if (regatta.reason) {
      reasonEl.textContent = regatta.reason;
      reasonEl.hidden = false;
    } else {
      reasonEl.hidden = true;
    }

    card.hidden = false;
  }

  function statusClass(status) {
    if (status === 'YES') return 'is-yes';
    if (status === 'PARTIAL') return 'is-partial';
    return 'is-no';
  }

  const STATUS_RANK = { NO: 0, PARTIAL: 1, YES: 2 };

  function addDays(date, n) {
    const d = new Date(date);
    d.setDate(d.getDate() + n);
    return d;
  }

  function isWeekend(date) {
    return date.getDay() === 0 || date.getDay() === 6;
  }

  function longDate(date) {
    return date.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }

  function shortDate(date) {
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  // Groups days starting at `start` into `count` slots. Each weekday is
  // its own slot; Saturday and Sunday share one "weekend" slot.
  function buildSlots(start, count) {
    const slots = [];
    let d = new Date(start);
    while (slots.length < count) {
      if (isWeekend(d)) {
        const days = [];
        while (isWeekend(d)) { days.push(d); d = addDays(d, 1); }
        slots.push({ weekend: true, days });
      } else {
        slots.push({ weekend: false, days: [d] });
        d = addDays(d, 1);
      }
    }
    return slots;
  }

  // Status and reason for a slot. A weekend slot shows the OYO workout
  // note (or a form entry's reason, if there is one), and reads OFF (no in-person practice) when both days
  // are off. If an override puts practice on either weekend day,
  // the card shows the busiest status and also lists each day's details
  // so nothing gets hidden.
  function slotDetails(slot, seasons, overrides) {
    const each = slot.days.map(d => ({ date: d, ...detailsFor(d, seasons, overrides) }));
    if (!slot.weekend) return each[0];

    const allOff = each.every(e => e.status === 'NO');
    if (allOff) {
      // A form entry with a reason (e.g. Winter Break) replaces the OYO note.
      const notes = [...new Set(each.filter(e => e.fromForm).map(e => e.reason))];
      return { status: 'NO', label: 'OFF', reason: notes.length ? notes.join('\n') : WEEKEND_TEXT };
    }

    const top = each.reduce((a, b) => (STATUS_RANK[b.status] > STATUS_RANK[a.status] ? b : a));
    const reason = WEEKEND_TEXT + '\n\n' + each.map(e =>
      WEEKDAYS[e.date.getDay()].slice(0, 3) + ': ' + e.status +
      (e.status === 'NO' && e.reason === 'Standard Schedule' ? '' : '\n' + e.reason)
    ).join('\n');
    return { status: top.status, reason };
  }

  // Shows the shift times once, above the cards, whenever a card lists
  // Early/Late squads.
  function showShiftKey() {
    const key = document.getElementById('shift-key');
    key.innerHTML = '';
    [['Early', WINTER_SHIFTS.early], ['Late', WINTER_SHIFTS.late]].forEach(([name, time], i) => {
      if (i) key.appendChild(document.createTextNode('  ·  '));
      const b = document.createElement('strong');
      b.textContent = name + ':';
      key.appendChild(b);
      key.appendChild(document.createTextNode(' ' + time));
    });
    key.hidden = false;
  }

  function makeCard({ label, date, status, statusText, reason, shifts, compact }) {
    if (shifts) showShiftKey();
    const card = document.createElement('div');
    card.className = 'card ' + statusClass(status) + (compact ? ' compact' : '');
    const reasonClass = 'reason' + (shifts ? ' shifts' : '');
    [['label', label], ['date', date], ['status', statusText || status], [reasonClass, reason]].forEach(([cls, text]) => {
      const el = document.createElement('span');
      el.className = cls;
      el.textContent = text;
      card.appendChild(el);
    });
    return card;
  }

  function renderTwoDay(today, seasons, overrides) {
    const grid = document.getElementById('status-grid');
    [['Today', today], ['Tomorrow', addDays(today, 1)]].forEach(([label, date]) => {
      const { status, reason, shifts } = detailsFor(date, seasons, overrides);
      grid.appendChild(makeCard({ label, date: longDate(date), status, reason, shifts }));
    });
  }

  // Today gets the big card on top; the next four slots sit underneath.
  function renderWeek(today, seasons, overrides) {
    const slots = buildSlots(today, 5);
    const grid = document.getElementById('status-grid');
    const week = document.getElementById('week-grid');

    slots.forEach((slot, i) => {
      const { status, label: statusText, reason, shifts } = slotDetails(slot, seasons, overrides);
      const first = slot.days[0];
      const last = slot.days[slot.days.length - 1];
      const isToday = i === 0;

      let label, date;
      if (slot.weekend) {
        label = isToday ? 'Today · Weekend' : 'Weekend';
        date = slot.days.length > 1
          ? shortDate(first) + ' – ' + shortDate(last)
          : longDate(first);
      } else {
        label = isToday ? 'Today' : WEEKDAYS[first.getDay()];
        date = isToday ? longDate(first) : shortDate(first);
      }

      const card = makeCard({ label, date, status, statusText, reason, shifts, compact: !isToday });
      (isToday ? grid : week).appendChild(card);
    });

    week.hidden = false;
  }

  (async function init() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const note = document.getElementById('note');

    try {
      const [seasons, overrides] = await Promise.all([
        fetchTab(SEASONS_GID),
        fetchTab(OVERRIDES_GID)
      ]);

      if (LAYOUT === 'week') renderWeek(today, seasons, overrides);
      else renderTwoDay(today, seasons, overrides);
      renderRegatta(upcomingRegatta(today, overrides));

      note.textContent = 'Updates automatically from the season schedule.';
    } catch (err) {
      console.error(err);
      note.textContent = 'Could not load the schedule right now. Try refreshing.';
      note.classList.add('error');
    }
  })();
</script>

</body>
</html>
